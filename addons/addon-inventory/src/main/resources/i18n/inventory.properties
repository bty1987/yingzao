# 库存域错误码与文案(310000 段;同码同消息,中英双语同步)
inventory.notfound=记录不存在
inventory.state.illegal=当前状态不允许该操作
inventory.param.invalid=参数非法
inventory.num.positive=数量必须为正数
inventory.warehouse.notFound=仓库不存在
inventory.warehouse.codeExists=仓库编号已存在
inventory.goods.notFound=商品不存在
inventory.sku.notFound=SKU属性不存在、不属于该商品或已停用
inventory.stock.rowMissing=商品库存行不存在
inventory.stock.insufficient=商品[{0}]库存不足
inventory.items.empty=单据明细不能为空
inventory.reversal.surplus=源单明细冲销余量不足
inventory.transfer.sameWarehouse=调拨出入库仓不能相同
inventory.transfer.title=库存调拨申请 {0}
inventory.requisition.closed=领料单已出库,不可撤销或拒绝
inventory.requisition.returnOver=退回数量超过已出库数量
inventory.requisition.decorationNotFound=装修单不存在
inventory.outsourcing.notFound=外辅单不存在
inventory.outsourcing.decorationNotFound=装修单不存在
inventory.outsourcing.accepted=工程已验收,外辅单不可登记(辅料已锁定)
inventory.outsourcing.deliverOver=送货数量超过申请数量
inventory.outsourcing.receiveOver=到货数量超过送货数量
inventory.outsourcing.cancelTooLate=外辅单已到货,不可作废
inventory.outsourcing.cancelled=已作废外辅单不可操作
inventory.outsourcing.notBalanced=外辅单非已结算状态,不可反结算
inventory.outsourcing.notReceived=外辅单未到货,不可结算
inventory.purchase.notFound=采购单不存在
inventory.purchase.itemNotFound=采购明细不存在
inventory.purchase.inboundOver=入库数量超过采购余量
inventory.purchase.allInbound=采购单已全部入库,不可操作
inventory.purchase.cancelled=采购单已取消,不可操作
inventory.purchase.editFrozen=采购单非初始状态,明细不可编辑

inventory.outsourcing.supplierNotFound=厂商不存在或不可引用
inventory.outsourcing.supplierDisabled=厂商已停用，不可挂新单
inventory.purchase.supplierNotFound=采购厂商不存在,请先在厂商管理建档
inventory.purchase.supplierDisabled=采购厂商已停用,请先启用或更换厂商
