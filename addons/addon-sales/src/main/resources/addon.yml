addon:
  id: sales
  name: 主材销售
  version: 0.4.0
  error-code-segment: 300000
  menus:
    - path: /sales/orders
      title: 销售单
      icon: shopping-cart
    - path: /sales/settlements
      title: 结算工作台
      icon: money
    - path: /sales/deliveries
      title: 配送履约
      icon: van
    - path: /sales/oales
      title: 外销单
      icon: sell
  dicts:
    orderStatus:
      - { key: '0', label: 初始 }
      - { key: '2', label: 全退 }
      - { key: '3', label: 倒单 }
      - { key: '4', label: 废单 }
      - { key: '5', label: 完结 }
    balanceStatus:
      - { key: '0', label: 无结 }
      - { key: '1', label: 预结 }
      - { key: '2', label: 厂结 }
      - { key: '3', label: 结算 }
    payStatus:
      - { key: '-1', label: 未录 }
      - { key: '0', label: 已录 }
      - { key: '1', label: 已付 }
      - { key: '2', label: 已确认 }
    settleStatus:
      - { key: '0', label: 预结 }
      - { key: '1', label: 厂结 }
      - { key: '2', label: 结算 }
    settleType:
      - { key: '0', label: 购货 }
      - { key: '1', label: 预结退货 }
      - { key: '2', label: 结算退货 }
      - { key: '3', label: 定金 }
    onetype:
      - { key: '0', label: 正常 }
      - { key: '2', label: 全退 }
      - { key: '3', label: 倒单 }
    refundStatus:
      - { key: '3', label: 审批中 }
      - { key: '0', label: 初始 }
      - { key: '1', label: 已退款 }
      - { key: '2', label: 无效 }
    refundType:
      - { key: '2', label: 全退 }
      - { key: '3', label: 倒单 }
    deliveryStatus:
      - { key: '0', label: 初始 }
      - { key: '1', label: 已配送 }
      - { key: '2', label: 已审核 }
      - { key: '3', label: 已确认 }
      - { key: '4', label: 已完结 }
    deliveryMilestone:
      - { key: '1', label: 配送 }
      - { key: '2', label: 审核 }
      - { key: '3', label: 确认 }
      - { key: '4', label: 完结 }
    batchStatus:
      - { key: '0', label: 计划 }
      - { key: '1', label: 已认领 }
    oalesStatus:
      - { key: '0', label: 草稿 }
      - { key: '1', label: 待确认 }
      - { key: '2', label: 已确认 }
      - { key: '3', label: 已收款 }
      - { key: '4', label: 已完结 }
      - { key: '8', label: 已废弃 }
    oalesType:
      - { key: '0', label: 购货 }
      - { key: '1', label: 退货 }
  metrics:
    # 月主材业绩(D4 北极星):当月签单权责额(PRD 开放问题 2 推荐),本域 SQL 查询期直出
    - key: sales.performance.materialMonthly
      nameKey: sales.metric.materialMonthly
      descKey: sales.metric.materialMonthly.desc
      sourceKey: sales.metric.materialMonthly.source
      frequency: realtime
      compare: monthOnMonth
      unit: cent
      status: confirmed
  api:
    # 结算驳回端点路径挂 /orders 前缀(历史路径),归销售单菜单;结算工作台角色建议连带授权销售单菜单
    - prefix: /api/sales/orders
      require: /sales/orders
    - prefix: /api/sales/refunds
      require: /sales/orders
    - prefix: /api/sales/settlements
      require: /sales/settlements
    - prefix: /api/sales/deliveries
      require: /sales/deliveries
    - prefix: /api/sales/delivery-items
      require: /sales/deliveries
    - prefix: /api/sales/delivery-flows
      require: /sales/deliveries
    - prefix: /api/sales/oales
      require: /sales/oales
