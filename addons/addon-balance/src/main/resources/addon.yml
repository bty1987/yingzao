      - { key: '0', label: 初始 }
      - { key: '1', label: 已绑定 }
    poolType:
      - { key: '0', label: 通用 }
      - { key: '1', label: 合作费 }
      - { key: '2', label: 活动费 }
      - { key: '3', label: 管理费 }
      - { key: '4', label: 保证金 }
      - { key: '5', label: 年返 }
    poolStatus:
      - { key: '0', label: 有效 }
      - { key: '1', label: 停用 }
    detailAction:
      - { key: 'cashIn', label: 出纳入金 }
      - { key: 'settleEnter', label: 结算入账 }
      - { key: 'payCash', label: 出纳付款 }
      - { key: 'lazySync', label: 归属账户同步 }
