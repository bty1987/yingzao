# 结算域错误码与文案(320000 段;同码同消息,中英双语同步)
balance.notFound=结算单不存在
balance.state.illegal=结算单当前状态不允许该操作
balance.item.dup=结算明细已绑入且快照不一致,请先解绑或线下核对
balance.money.positive=金额必须大于零
balance.account.notFound=结算账户不存在
balance.account.disabled=结算账户已停用
balance.account.insufficient=出纳账户余额不足
balance.settlement.surplus.short=结算单余量不足
balance.pool.notFound=扣款池不存在
balance.pool.insufficient=扣款池余量不足
balance.cutpay.notFound=扣款单不存在
balance.cutpay.notBound=扣款单未绑定,不可解绑
balance.cutpay.bound=扣款单已绑定,不可重复绑定
balance.finished=结算单已完结,不可操作
balance.paymark.duplicated=结算单已打付款标,不可重复操作
balance.finish.guard=完结条件不满足(余量未清零或未打付款标)
balance.discount.invalid=折扣金额非法(须介于 0 与应付之间)
balance.withdraw.locked=结算单已锁定,明细不可退回
balance.delete.hasItems=结算单尚有明细,不可删除
balance.deduct.exceed=扣款子流水超出扣款单金额
balance.account.type.mismatch=账户类型不匹配
balance.belonger.mismatch=结算单与账户归属不一致
balance.item.notFound=结算明细不存在
balance.account.dup=该归属人同类型账户已存在
balance.param.invalid=参数非法
