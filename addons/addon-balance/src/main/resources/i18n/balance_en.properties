# Balance domain error codes and messages (segment 320000; same code same message, EN synced)
balance.notFound=Settlement not found
balance.state.illegal=Operation not allowed in current settlement status
balance.item.dup=Item already bound with a different snapshot, unbind it or reconcile offline first
balance.money.positive=Amount must be greater than zero
balance.account.notFound=Balance account not found
balance.account.disabled=Balance account is disabled
balance.account.insufficient=Insufficient cashier account balance
balance.settlement.surplus.short=Insufficient settlement surplus
balance.pool.notFound=Cut-payment pool not found
balance.pool.insufficient=Insufficient cut-payment pool balance
balance.cutpay.notFound=Cut-payment order not found
balance.cutpay.notBound=Cut-payment order is not bound, cannot unbind
balance.cutpay.bound=Cut-payment order already bound, cannot bind again
balance.finished=Settlement finished, operation rejected
balance.paymark.duplicated=Settlement already marked as paid
balance.finish.guard=Finish conditions not met (surplus not cleared or payment not marked)
balance.discount.invalid=Invalid discount amount (must be between 0 and payable)
balance.withdraw.locked=Settlement locked, item cannot be withdrawn
balance.delete.hasItems=Settlement still has items, cannot delete
balance.deduct.exceed=Deduct sub-records exceed the cut-payment amount
balance.account.type.mismatch=Account type mismatch
balance.belonger.mismatch=Settlement and account belonger mismatch
balance.item.notFound=Settlement item not found
balance.account.dup=Account of the same belonger and type already exists
balance.param.invalid=Invalid parameter
