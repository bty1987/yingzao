addon:
  id: customerprofile
  name: 客户与楼盘档案
  version: 0.2.0
  error-code-segment: 330000
  menus:
    - path: /customerprofile/customers
      title: 客户档案
      icon: user
  dicts:
    customerStatus:
      - { key: '0', label: 初始 }
      - { key: '1', label: 已实名 }
    phoneStatus:
      - { key: '0', label: 启用 }
      - { key: '1', label: 停用 }
    accountType:
      - { key: '0', label: 对私 }
      - { key: '1', label: 对公 }
  mounts:
    - { slot: customerprofile.profile.detail.footer, component: ProfileTag, capability: customerprofile:view }
  api:
    # 档案域全部数据源归「客户档案」菜单;exist 幂等回显另挂 capability 示范功能点型 require
    - prefix: /api/customerprofile
      require: /customerprofile/customers
    - exact: /api/customerprofile/customers/exist
      require: customerprofile:view
    # 列表搜索端点(exact 仅放行 /customers 列表)authenticated:装修单登记等跨页客户选择器引用;
    # 详情子资源(电话/账户/审计)仍归菜单闸
    - exact: /api/customerprofile/customers
      require: authenticated
      methods: [GET]
