addon:
  id: portal
  name: C端门户
  version: 0.2.0
  error-code-segment: 360000
  # C 端无管理菜单(员工端 RBAC 菜单树不含);api 段走第四/五型 require
  api:
    - exact: /api/c/auth/code
      methods: [POST]
      require: anonymous
    - exact: /api/c/auth/login
      methods: [POST]
      require: anonymous
    - exact: /api/c/cases
      methods: [GET]
      require: anonymous
    - exact: /api/c/progress
      methods: [GET]
      require: c-customer
    - exact: /api/c/orders
      methods: [GET]
      require: c-customer
    - exact: /api/c/points
      methods: [GET]
      require: c-customer
    # R20 资金流水/工地相册(登录;归属校验 360004 收口在 service)
    - exact: /api/c/finance
      methods: [GET]
      require: c-customer
    - exact: /api/c/album
      methods: [GET]
      require: c-customer
    # 相册图片字节流(prefix:path variable;<image> 发不了票据,前端 downloadFile 换本地路径)
    - prefix: /api/c/files
      methods: [GET]
      require: c-customer
