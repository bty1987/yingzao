addon:
  id: basedata
  name: 基础数据
  version: 0.3.0
  error-code-segment: 260000
  menus:
    - path: /basedata/goods
      title: 商品档案
      icon: goods
    - path: /basedata/packages
      title: 整装定材
      icon: box
  dicts:
    goodsStatus:
      - { key: '0', label: 启用 }
      - { key: '1', label: 停用 }
    goodsType:
      - { key: '0', label: 商品 }
      - { key: '1', label: 套餐 }
    skuAttrType:
      - { key: '0', label: 颜色 }
      - { key: '1', label: 规格 }
    calcType:
      - { key: '0', label: 底价 }
      - { key: '1', label: 点位 }
    packageLevel:
      - { key: '0', label: 主数据 }
      - { key: '1', label: 引用 }
  api:
    # 档案读开放(authenticated):商品列表/SKU 是销售开单·库存·报价的跨页选择器数据源;
    # 写操作收两菜单;org 隔离由 L0 硬边界保证。同前缀 methods 互补分层:GET 命中读规则,写命中菜单规则。
    - prefix: /api/basedata/goods
      require: authenticated
      methods: [GET]
    - prefix: /api/basedata/goods
      require: /basedata/goods
    - prefix: /api/basedata/models
      require: /basedata/goods
    - prefix: /api/basedata/categories
      require: /basedata/goods
    # 品牌字典 GET 读放开(厂商管理页品牌关联下拉的跨页数据源,第 41 次随 addon-supplier 补)
    - exact: /api/basedata/brands
      require: authenticated
      methods: [GET]
    - prefix: /api/basedata/brands
      require: /basedata/goods
    # 品类树 GET 读放开(厂商页品类细化下拉的跨页数据源)
    - exact: /api/basedata/categories
      require: authenticated
      methods: [GET]
    - prefix: /api/basedata/categories
      require: /basedata/goods
    - prefix: /api/basedata/packages
      require: /basedata/packages
