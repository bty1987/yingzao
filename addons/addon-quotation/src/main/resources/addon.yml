addon:
  id: quotation
  name: 报价管理
  version: 0.6.0
  error-code-segment: 230000
  menus:
    - path: /quotation/quotations
      title: 报价管理
      icon: edit
    - path: /quotation/catalog
      title: 报价项库
      icon: goods
    - path: /quotation/norms
      title: 定额管理
      icon: list
  dicts:
    arStatus:
      - { key: '0', label: 草稿 }
      - { key: '1', label: 已提交 }
      - { key: '2', label: 已付款 }
      - { key: '3', label: 已确认 }

    quotationStatus:
      - { key: '0', label: 编辑中 }
      - { key: '1', label: 已锁定 }
    attStatus:
      - { key: '0', label: 初始 }
      - { key: '1', label: 已提交 }
      - { key: '2', label: 已审核 }
      - { key: '3', label: 已完成 }
    areaType:
      - { key: '0', label: 管理区 }
      - { key: '1', label: 工程量 }
      - { key: '2', label: 功能区总价 }
      - { key: '3', label: 不计算 }
      - { key: '7', label: 综合区 }
    itemType:
      - { key: '0', label: 常规 }
      - { key: '1', label: 自定义 }
      - { key: '2', label: 搬运费 }
      - { key: '3', label: 管理费 }
      - { key: '4', label: 忽略 }
      - { key: '8', label: 税金 }
    itemSubtype:
      - { key: '0', label: 工程 }
      - { key: '1', label: 材料 }
    versionStatus:
      - { key: '0', label: 停用 }
      - { key: '1', label: 启用 }
    catalogStatus:
      - { key: '0', label: 启用 }
      - { key: '1', label: 停用 }
    trackAction:
      - { key: 'create', label: 建报价 }
      - { key: 'lock', label: 定稿锁定 }
      - { key: 'unlock', label: 解锁 }
      - { key: 'submit', label: 提交审核 }
      - { key: 'audit', label: 审核通过 }
      - { key: 'finish', label: 审核完成 }
      - { key: 'setDefault', label: 设为默认 }
      - { key: 'areaSave', label: 明细变更 }
      - { key: 'reprice', label: 保价重算 }
    normKind:
      - { key: '0', label: 材料 }
      - { key: '1', label: 人工 }
      - { key: '2', label: 工时 }
    normSourceType:
      - { key: '0', label: 报价 }
      - { key: '1', label: 拓展 }
      - { key: '2', label: 增减 }
      - { key: '3', label: 附加 }
    normStatus:
      - { key: '0', label: 初始 }
      - { key: '1', label: 禁用 }
      - { key: '2', label: 已确认 }
      - { key: '3', label: 已驳回 }
    normAtttype:
      - { key: '0', label: 收 }
      - { key: '1', label: 支 }
  api:
    - prefix: /api/quotation
      require: /quotation/quotations
