services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: yingzao
      MYSQL_DATABASE: yingzao
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pyingzao"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    # F2 认证 Redis 化(docs/15 R22~R23):仅 yingzao.auth.store=redis 时触达;
    # 不发布 6379 到宿主机(内网互通即可,防与本机既有 redis 撞端口)

  app:
    build: ..
    environment:
      YINGZAO_DB_URL: jdbc:mysql://mysql:3306/yingzao?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      YINGZAO_DB_USER: root
      YINGZAO_DB_PASSWORD: yingzao
      # F2 会话存储:缺省 memory,一行切 redis(compose 部署 YINGZAO_AUTH_STORE=redis 即启用)
      YINGZAO_AUTH_STORE: ${YINGZAO_AUTH_STORE:-memory}
      YINGZAO_REDIS_HOST: ${YINGZAO_REDIS_HOST:-redis}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      # F1 文件存储 local provider(yingzao.file.local.base-dir=./data/files)
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
