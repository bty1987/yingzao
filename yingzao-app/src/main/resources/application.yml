server:
  port: 8080

spring:
  application:
    name: yingzao
  datasource:
    url: ${YINGZAO_DB_URL:jdbc:mysql://localhost:3306/yingzao?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${YINGZAO_DB_USER:root}
    password: ${YINGZAO_DB_PASSWORD:yingzao}
  flyway:
    enabled: true
    # addon 版本段独立演进必然交错(如 customer V201 晚于 customerprofile V300 出现),允许乱序应用
    out-of-order: true
    # 版本号分段约定:core 100-199,addon 按码段对齐(customer 200+,quotation 400+,decoration 500+,
    # construction 600+,basedata 700+,payment 800+,example 900+,market 1000+,sales 1100+,
    # inventory 1200+,balance 1300+,customerprofile 1400+)
    # locations 只保留内核项;各插件 classpath:db/migration/<id> 由 AddonConventionPostProcessor
    # 按 addon.yml 约定在配置绑定前追加(新插件零登记)
    locations: classpath:db/migration/core
  messages:
    # basename 只保留内核项;各插件 i18n/<id> 由 AddonConventionPostProcessor 按 addon.yml
    # 约定在配置绑定前追加(新插件零登记;独立 basename 避免 jar 内同名资源冲突)
    basename: i18n/messages
    encoding: UTF-8
  servlet:
    multipart:
      # 容器层上限(兜底);业务级单文件限额 = yingzao.file.max-size-mb(file service 125002)
      max-file-size: ${YINGZAO_FILE_MAXUPLOAD:100MB}
      max-request-size: ${YINGZAO_FILE_MAXREQ:200MB}
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      # F2 认证 Redis 化(docs/15 R22~R23):仅 yingzao.auth.store=redis 时触达;
      # Lettuce 懒连接,内存模式零连接。密码场景在部署侧补 spring.data.redis.password
      host: ${YINGZAO_REDIS_HOST:127.0.0.1}
      port: ${YINGZAO_REDIS_PORT:6379}
      connect-timeout: ${YINGZAO_REDIS_CONNECTTIMEOUT:3s}
      timeout: ${YINGZAO_REDIS_TIMEOUT:3s}

yingzao:
  auth:
    # 会话存储后端(F2):memory=内存缺省(重启丢会话,不可水平扩展)/ redis=生产推荐(多实例共享会话)
    store: ${YINGZAO_AUTH_STORE:memory}
    # 会话 TTL(小时):签发即定不滑动;双后端同语义,缺省 12h=存量行为
    ttl-hours: ${YINGZAO_AUTH_TTLHOURS:12}
  file:
    # F1 文件存储抽象(docs/15 R10):local 磁盘首发,OSS/MinIO provider 随部署形态扩展;
    # allowed-content-types 非空=覆盖缺省白名单(image/* 前缀+常用文档)
    storage: ${YINGZAO_FILE_STORAGE:local}
    max-size-mb: ${YINGZAO_FILE_MAXSIZEMB:20}
    allowed-content-types: ${YINGZAO_FILE_TYPES:}
    local:
      base-dir: ${YINGZAO_FILE_BASEDIR:./data/files}
  # 启用的插件清单(编译期装配,未列出的 addon bean 不装配)
  addons:
    enabled: customer,customerprofile,example,basedata,payment,decoration,quotation,construction,inventory,sales,balance,market,supplier,member,portal,target,service,dashboard
  rbac:
    # RBAC v2 端点鉴权模式:observe=未声明 API 放行+审计(默认,存量补声明期)/enforce=未声明即拒(全插件补齐后的终态)
    mode: ${YINGZAO_RBAC_MODE:observe}
  events:
    # 事件总线三件套调参:重试退避基数(秒,指数翻倍)与上限;max-retries 超限转死信
    backoff-seconds: ${YINGZAO_EVENTS_BACKOFFSECONDS:60}
    backoff-cap-seconds: ${YINGZAO_EVENTS_BACKOFFCAPSECONDS:3600}
    max-retries: ${YINGZAO_EVENTS_MAXRETRIES:5}
  crypto:
    # 敏感字段加密密钥(AES-256-GCM + HMAC-SHA256,base64);默认值仅限本地开发冒烟,生产必须环境变量覆盖,
    # 且必须与会话/令牌类密钥分离(老系统一把钥匙开两把锁的教训)。
    aes-key: ${YINGZAO_CRYPTO_AES_KEY:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
    hmac-key: ${YINGZAO_CRYPTO_HMAC_KEY:ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8=}

logging:
  level:
    com.yingzao: info
