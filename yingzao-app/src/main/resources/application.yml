server:
  port: 8080

spring:
  application:
    name: yingzao
  datasource:
    url: ${YINGZAO_DB_URL:jdbc:mysql://localhost:3306/yingzao?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${YINGZAO_DB_USER:root}
    password: ${YINGZAO_DB_PASSWORD:yingzao}
  flyway:
    enabled: true
    # addon 版本段独立演进必然交错(如 customer V201 晚于 customerprofile V300 出现),允许乱序应用
    out-of-order: true
    # 版本号分段约定:core 100-199,addon 按码段对齐(customer 200+,quotation 400+,decoration 500+,
    # construction 600+,basedata 700+,payment 800+,example 900+,market 1000+,sales 1100+,
    # inventory 1200+,balance 1300+,customerprofile 1400+)
    locations: classpath:db/migration/core, classpath:db/migration/customer, classpath:db/migration/customerprofile, classpath:db/migration/example, classpath:db/migration/basedata, classpath:db/migration/payment, classpath:db/migration/decoration, classpath:db/migration/quotation, classpath:db/migration/construction, classpath:db/migration/inventory, classpath:db/migration/sales, classpath:db/migration/balance, classpath:db/migration/market, classpath:db/migration/supplier
  messages:
    # 各 addon 独立 basename,避免 jar 内同名资源冲突
    basename: i18n/messages,i18n/customer,i18n/customerprofile,i18n/example,i18n/basedata,i18n/payment,i18n/decoration,i18n/quotation,i18n/construction,i18n/inventory,i18n/sales,i18n/balance,i18n/market,i18n/supplier
    encoding: UTF-8
  jackson:
    default-property-inclusion: non_null

yingzao:
  # 启用的插件清单(编译期装配,未列出的 addon bean 不装配)
  addons:
    enabled: customer,customerprofile,example,basedata,payment,decoration,quotation,construction,inventory,sales,balance,market,supplier
  rbac:
    # RBAC v2 端点鉴权模式:observe=未声明 API 放行+审计(默认,存量补声明期)/enforce=未声明即拒(全插件补齐后的终态)
    mode: ${YINGZAO_RBAC_MODE:observe}
  events:
    # 事件总线三件套调参:重试退避基数(秒,指数翻倍)与上限;max-retries 超限转死信
    backoff-seconds: ${YINGZAO_EVENTS_BACKOFFSECONDS:60}
    backoff-cap-seconds: ${YINGZAO_EVENTS_BACKOFFCAPSECONDS:3600}
    max-retries: ${YINGZAO_EVENTS_MAXRETRIES:5}
  crypto:
    # 敏感字段加密密钥(AES-256-GCM + HMAC-SHA256,base64);默认值仅限本地开发冒烟,生产必须环境变量覆盖,
    # 且必须与会话/令牌类密钥分离(老系统一把钥匙开两把锁的教训)。
    aes-key: ${YINGZAO_CRYPTO_AES_KEY:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
    hmac-key: ${YINGZAO_CRYPTO_HMAC_KEY:ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8=}

logging:
  level:
    com.yingzao: info
